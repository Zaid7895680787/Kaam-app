name: Build Job APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Job project
        run: |
          unzip -o Job_App_Real_Starter.zip d extracted
          mkdir job_project
          cp -r extracted/*/* job_project/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Create Android project files
        working-directory: job_project
        run: flutter create --platforms=android .

      - name: Get packages
        working-directory: job_project
        run: flutter pub get

      - name: Build APK
        working-directory: job_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Job-APK
          path: job_project/build/app/outputs/flutter-apk/app-release.apk
